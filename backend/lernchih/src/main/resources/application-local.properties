# Local H2 profile for development/demo

spring.datasource.url=jdbc:h2:mem:lernchih;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

spring.h2.console.enabled=true
spring.flyway.enabled=false

# Seed demo data on every startup
app.seed.enabled=true

# JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=86400000
app.jwt.refresh-expiration=604800000

# File Upload
app.upload.dir=./uploads
app.files.max-upload-size=52428800
app.files.large-download-threshold=10485760

# Mail (Mailpit defaults)
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}

# CORS (comma-separated lists of allowed origins)
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}

# Rate limiting (Bucket4j token buckets, per client IP)
app.ratelimit.auth.capacity=10
app.ratelimit.auth.refill-per-minute=10
app.ratelimit.write.capacity=60
app.ratelimit.write.refill-per-minute=60
app.ratelimit.public.capacity=120
app.ratelimit.public.refill-per-minute=120
