# Run from the repository root so Docker Compose loads the repository-root .env file:
#   docker compose -f infrastructure/docker-compose.yml up -d
#
# This compose file starts the data stores (MySQL, OpenSearch, Mailpit) and the
# Spring Boot backend. The backend waits for MySQL and OpenSearch to report
# healthy before it starts.

services:
  mysql:
    image: mysql:8.0.36
    container_name: lernchih-mysql
    environment:
      # Use DB_PASSWORD from .env; the fallback is for quick local Docker use only.
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_DATABASE: lernchih_db
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  opensearch:
    image: opensearchproject/opensearch:2.14.0
    container_name: lernchih-opensearch
    environment:
      - discovery.type=single-node
      - plugins.security.disabled=true
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=${OPENSEARCH_PASSWORD:-StrongP@ssw0rd!}
    ports:
      - "${OPENSEARCH_HTTP_PORT:-9200}:9200"
      - "${OPENSEARCH_PERFORMANCE_PORT:-9600}:9600"
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  mailpit:
    image: axllent/mailpit:latest
    container_name: lernchih-mailpit
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"
    volumes:
      - mailpit_data:/data

  backend:
    image: eclipse-temurin:25-jdk
    container_name: lernchih-backend
    ports:
      - "${SERVER_PORT:-8080}:8080"
    volumes:
      - ../backend/lernchih/target/lernchih-0.0.1-SNAPSHOT.jar:/opt/lernchih/lernchih.jar:ro
    working_dir: /opt/lernchih
    command: ["java", "-Xmx512m", "-jar", "lernchih.jar"]
    depends_on:
      mysql:
        condition: service_healthy
      opensearch:
        condition: service_healthy

volumes:
  mysql_data:
  opensearch_data:
  mailpit_data:
