# Local H2 profile for development/demo.
# Copy .env.local.example to .env.local and set JWT_SECRET before starting.

# Embedded H2 database
spring.datasource.url=jdbc:h2:mem:lernchih;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

spring.h2.console.enabled=true
spring.flyway.enabled=false

# Seed demo data on every startup
app.seed.enabled=true

# Local quick start only requires JWT_SECRET (H2 has no DB_PASSWORD).
app.env.required-vars=JWT_SECRET

# Mail health indicator is not available in local H2 mode (no SMTP server).
management.health.mail.enabled=false
