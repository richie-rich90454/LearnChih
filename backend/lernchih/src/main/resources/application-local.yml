# Local / demo profile: runs with an embedded H2 database so the app starts
# without requiring Docker or an external MySQL server.
# Activate with: -Dspring.profiles.active=local

spring:
  datasource:
    url: jdbc:h2:mem:lernchih_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MYSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  h2:
    console:
      enabled: true
      path: /h2-console
  flyway:
    enabled: false

# Disable external service dependencies that are not available in local demo mode.
app:
  jwt:
    secret: ${JWT_SECRET:local-dev-jwt-secret-must-be-at-least-32-characters-long}
  env:
    required-vars: ""
  opensearch:
    seed:
      enabled: false
