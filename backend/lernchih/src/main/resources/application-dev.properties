# ============================================================
# LernChih - Development Profile Configuration
# Task 10.4 / Spec I108
#
# Activate with: ./mvnw spring-boot:run -Dspring-boot.run.profiles=dev
# This profile enables dev-friendly defaults and the dev data seeder.
# It is NOT intended for production or CI test runs.
# ============================================================

# Dev datasource (assumes a local MySQL/MariaDB instance)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/lernchih_db?useSSL=false&serverTimezone=UTC&characterEncoding=utf8mb4}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# Flyway: keep schema migrations enabled in dev
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# JPA: validate against the Flyway-managed schema
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT: fixed dev secret (must be changed in production)
app.jwt.secret=${JWT_SECRET:dev-jwt-secret-must-be-changed-in-production}

# Dev mail server (Mailpit default)
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}

# File uploads relative to project root
app.upload.dir=./uploads

# Disable HTTPS-only enforcement for local HTTP dev
app.security.https-only=false

# Allow local frontend dev servers
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}

# SEO base URL for local dev
app.seo.base-url=${SEO_BASE_URL:http://localhost:5173}

# Verbose logging for local debugging
logging.level.com.richardjiang880.lernchih=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# Seed data (Task 10.4)
app.seed.enabled=true

# OpenSearch seed (enable when running the local OpenSearch container)
app.opensearch.host=localhost
app.opensearch.port=9200
app.opensearch.seed.enabled=true
