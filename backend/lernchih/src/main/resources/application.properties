spring.application.name=lernchih

# MySQL Datasource
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/lernchih_db?useSSL=false&serverTimezone=UTC&useUnicode=true&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP connection pool tuning (Task 3.5)
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.pool-name=LernchihHikariCP

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=86400000
# Refresh token expiration (7 days in milliseconds)
app.jwt.refresh-expiration=604800000

# Mail (Mailpit)
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=${MAIL_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:false}

# File Upload
app.upload.dir=./uploads
app.files.max-upload-size=52428800
app.files.large-download-threshold=10485760
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Server
server.port=${SERVER_PORT:8080}
# HTTP/2 for reduced connection overhead (Task 3.5)
server.http2.enabled=true

# Graceful shutdown: wait up to 30s for active requests to finish.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# Static resource serving
spring.web.resources.static-locations=classpath:/static/
spring.web.resources.cache.period=3600
server.compression.enabled=true
server.compression.mime-types=application/javascript,application/json,application/xml,text/html,text/xml,text/plain,text/css,application/octet-stream
server.compression.min-response-size=1024

# CORS (comma-separated lists of allowed origins)
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}

# Security
# When true (production behind HTTPS terminator): enforce secure channel + HSTS preload.
app.security.https-only=${HTTPS_ONLY:false}

# Rate limiting (Bucket4j token buckets, per client IP)
app.ratelimit.auth.capacity=10
app.ratelimit.auth.refill-per-minute=10
app.ratelimit.write.capacity=60
app.ratelimit.write.refill-per-minute=60
app.ratelimit.public.capacity=120
app.ratelimit.public.refill-per-minute=120

# Springdoc / OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

# Actuator
management.endpoints.web.exposure.include=health,info,metrics,loggers
management.endpoint.health.show-details=when-authorized
management.endpoints.web.base-path=/actuator
management.endpoint.health.group.readiness.include=readinessState,db
management.endpoint.health.group.readiness.show-details=always
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.liveness.show-details=always

# Logging (request id from MDC, set by RequestIdFilter)
logging.pattern.level=%5p [request-id=%X{requestId}]

# SEO
# Public base URL used to build absolute URLs in robots.txt and sitemaps.
app.seo.base-url=${SEO_BASE_URL:http://localhost:5173}
# When true, normalize public URLs (trailing slash, lowercase, canonical host) via 301.
# Disabled by default to avoid surprising local dev behavior.
app.seo.url-normalize=${SEO_URL_NORMALIZE:false}
# Optional canonical host (e.g. example.com). When set and url-normalize is true,
# requests whose Host header differs are 301-redirected to this host. Leave empty to skip.
app.seo.canonical-host=${SEO_CANONICAL_HOST:}

# i18n (Task 5.1)
spring.messages.basename=messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false

# Seed data: disabled by default. Enable only in dev/test environments.
app.seed.enabled=false

# OpenSearch seed (disabled by default; enable when OpenSearch is available)
app.opensearch.host=localhost
app.opensearch.port=9200
app.opensearch.seed.enabled=false
